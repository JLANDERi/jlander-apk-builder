name: Build APK

# Started by the PHP server (api.php) with a job branch that holds job/config.json + job/icons.zip
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job id
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: node tools/generate.js job/config.json job/icons.zip app-out job/site.zip

      - name: Signing key
        working-directory: app-out
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            keytool -genkeypair -keystore release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=WebApp, O=JLANDER, C=PK"
          fi

      - name: Build
        working-directory: app-out
        run: gradle $(cat .gradle-tasks) --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app-out/app/build/outputs/apk/**/*.apk
            app-out/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 1
